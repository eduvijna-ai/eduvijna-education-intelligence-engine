[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eduvijna-backend"
version = "0.1.0"
description = "Eduvijna Education Intelligence Engine API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.48,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy>=2.0.50,<3",
  "alembic>=1.18,<2",
  "httpx>=0.28,<1",
  "mcp==2.2.0",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6.1,<7",
  "pyyaml>=6,<7",
  "python-docx>=1.2,<2",
  "langgraph>=0.4,<1",
  "langgraph-checkpoint-sqlite>=2.0,<3",
  "langgraph-checkpoint-postgres>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "c01_at01: C01 acceptance test AT01 disposable harness",
    "c01_at02: C01 acceptance test AT02 exact constraints",
    "c01_at03: C01 acceptance test AT03 0021 preflight",
    "c01_at04: C01 acceptance test AT04 legacy audit",
    "c01_at05: C01 acceptance test AT05 concurrency",
    "c01_at06: C01 acceptance test AT06 migration paths",
    "c01_at07: C01 acceptance test AT07 atomic recovery",
    "c01_at08: C01 acceptance test AT08 SQLite backup",
    "c01_at09: C01 acceptance test AT09 PostgreSQL backup",
    "c01_at10: C01 acceptance test AT10 CI evidence",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["migrations/"]
