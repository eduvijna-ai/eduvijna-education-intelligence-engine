[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eduvijna-backend"
version = "0.1.0"
description = "Eduvijna Education Intelligence Engine API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.48,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy>=2.0.50,<3",
  "alembic>=1.18,<2",
  "httpx>=0.28,<1",
  "mcp==2.2.0",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["migrations/"]
