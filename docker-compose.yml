services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env.development
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: sqlite:////app/data/eduvijna.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - eduvijna_sqlite:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    env_file:
      - path: .env.development
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  eduvijna_sqlite:
