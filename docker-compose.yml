services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - APP_ENV
      - ANYTHINGLLM_BASE_URL
      - ANYTHINGLLM_API_KEY
      - API_SECRET_KEY
      - MCP_API_KEY
      - CORS_ORIGINS
      - SOURCE_STORAGE_DIR
      - SOURCE_MAX_BYTES
      - SOURCE_URL_TIMEOUT_SECONDS
      - SOURCE_MAX_REDIRECTS
      - DATABASE_URL=sqlite:////app/data/eduvijna.db
    volumes:
      - eduvijna_sqlite:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  eduvijna_sqlite:
