name: Targeted PR CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: targeted-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EDUVIJNA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  backend-targeted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest — implemented task only
        run: |
          mapfile -t targets < <(grep -Ev '^\s*(#|$)' ../.eduvijna/pytest-targets.txt)
          if (( ${#targets[@]} == 0 )); then
            echo "No pytest targets configured. Cursor must scope .eduvijna/pytest-targets.txt to the implemented task."
            exit 2
          fi
          printf 'Target pytest: %s\n' "${targets[@]}"
          pytest -q "${targets[@]}"

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend-targeted]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare development env
        run: |
          cp .env.development.example .env.development
          printf '\nANYTHINGLLM_BASE_URL=http://anythingllm.example\nANYTHINGLLM_API_KEY=ci-dummy-anything-key\nMCP_API_KEY=ci-dummy-mcp-key\n' >> .env.development
      - name: Validate backend Compose
        run: docker compose --env-file .env.development config
      - name: Build backend only
        run: docker compose --env-file .env.development build backend
      - name: Pytest in Compose backend — implemented task only
        run: |
          mapfile -t targets < <(grep -Ev '^\s*(#|$)' .eduvijna/pytest-targets.txt)
          if (( ${#targets[@]} == 0 )); then
            echo "No pytest targets configured."
            exit 2
          fi
          docker compose --env-file .env.development run --rm \
            -e EDUVIJNA_CANDIDATE_SHA \
            backend pytest -q "${targets[@]}"
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.development down
