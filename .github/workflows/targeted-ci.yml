name: Targeted PR CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: targeted-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EDUVIJNA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  frontend-targeted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify client bundle excludes answer-key payloads
        run: npm run verify:bundle
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Playwright e2e
        run: npm run test:e2e

  c01-migration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: c01_ci
          POSTGRES_PASSWORD: c01_ci
          POSTGRES_DB: c01_ci
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U c01_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: pip install -e '.[dev]'
      - name: C01 disposable PostgreSQL migration proof
        env:
          EDUVIJNA_C01_DISPOSABLE_DATABASE_URL: postgresql+psycopg://c01_ci:c01_ci@127.0.0.1:55433/postgres
          EDUVIJNA_C01_DISPOSABLE_PG: "1"
        run: |
          test "$(git rev-parse HEAD)" = "${EDUVIJNA_CANDIDATE_SHA}"
          python - <<'PY'
          import os
          import uuid
          from sqlalchemy import create_engine, text
          from tests.c01_at_support import create_owned_pg_database, pg_admin_url_from_disposable
          from tests.c01_disposable_pg import C01_PG_URL

          admin = pg_admin_url_from_disposable(os.environ[C01_PG_URL])
          name = f"c01_at_{uuid.uuid4().hex[:12]}"
          owned = create_owned_pg_database(admin, name)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"EDUVIJNA_C01_DISPOSABLE_DATABASE_URL={owned}\n")
          with create_engine(owned).connect() as conn:
              n = conn.execute(text(
                  "SELECT COUNT(*) FROM information_schema.tables "
                  "WHERE table_schema = current_schema() AND table_type = 'BASE TABLE'"
              )).scalar_one()
              assert int(n) == 0, "expected empty owned disposable database"
          PY
          python -m pytest tests/test_c01_at*.py tests/test_c01_migration_portability.py \
            --junitxml=../docs/execution/C01-AT-junit-ci.xml \
            --maxfail=0 -q

  backend-targeted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: pip install -e '.[dev]'
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${EDUVIJNA_CANDIDATE_SHA}"
      - name: Ruff
        run: ruff check app tests migrations/c01_d13_synthetic_preflight.py migrations/c01_constraints.py
      - name: Mypy
        run: mypy app
      - name: Pytest — implemented task only
        run: |
          test "$(git rev-parse HEAD)" = "${EDUVIJNA_CANDIDATE_SHA}"
          mapfile -t targets < <(grep -Ev '^\s*(#|$)' ../.eduvijna/pytest-targets.txt)
          if (( ${#targets[@]} == 0 )); then
            if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
              echo "Draft implementation PR has no pytest targets yet; skipping until Cursor adds active-task selectors."
              exit 0
            fi
            echo "No pytest targets configured. Cursor must scope .eduvijna/pytest-targets.txt to the implemented task."
            exit 2
          fi
          printf 'Target pytest: %s\n' "${targets[@]}"
          python -m pytest -q "${targets[@]}"
      - name: Verify Day 8 and Day 9 founder harness on exact PR head
        run: |
          test "$(git rev-parse HEAD)" = "${EDUVIJNA_CANDIDATE_SHA}"
          python -m app.day8_verify
          python -m app.day9_verify
          python -m app.day10_verify --json
          python -m app.day12_verify --json
          python -m app.day13_verify --json
          python -m app.day14_verify --json
          python -m app.day16_verify --json
          python -m app.day18_verify --json

  compose-smoke:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: [backend-targeted]
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact PR head for image build metadata
        run: |
          git fetch --no-tags --depth=1 origin "${EDUVIJNA_CANDIDATE_SHA}"
          git checkout --detach "${EDUVIJNA_CANDIDATE_SHA}"
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${EDUVIJNA_CANDIDATE_SHA}" ]]; then
            echo "HEAD mismatch: expected ${EDUVIJNA_CANDIDATE_SHA} got ${actual}"
            exit 1
          fi
          echo "EDUVIJNA_BUILD_REVISION=${actual}" >> "${GITHUB_ENV}"
      - name: Prepare development env
        run: |
          cp .env.development.example .env.development
          printf '\nANYTHINGLLM_BASE_URL=http://anythingllm.example\nANYTHINGLLM_API_KEY=ci-dummy-anything-key\nMCP_API_KEY=ci-dummy-mcp-key\n' >> .env.development
          printf 'EDUVIJNA_BUILD_REVISION=%s\n' "${EDUVIJNA_BUILD_REVISION}" >> .env.development
      - name: Validate backend Compose
        run: docker compose --env-file .env.development config
      - name: Build backend only
        run: docker compose --env-file .env.development build backend
      - name: Pytest in Compose backend — implemented task only
        run: |
          mapfile -t targets < <(grep -Ev '^\s*(#|$)' .eduvijna/pytest-targets.txt)
          if (( ${#targets[@]} == 0 )); then
            echo "No pytest targets configured."
            exit 2
          fi
          docker compose --env-file .env.development run --rm \
            -e EDUVIJNA_CANDIDATE_SHA \
            backend pytest -q "${targets[@]}"
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.development down
