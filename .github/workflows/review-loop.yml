name: Eduvijna Cursor-Codex Review Loop

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cursor-complete-to-codex:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'EDUVIJNA_CURSOR_COMPLETE') &&
      !contains(github.event.comment.body, '@cursor')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const body = context.payload.comment.body || "";
            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const head = pr.data.head.sha;

            const completion = body.match(/EDUVIJNA_CURSOR_COMPLETE\s+([0-9a-f]{40})/i);
            if (!completion || completion[1].toLowerCase() !== head.toLowerCase()) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body:
                  "<!-- eduvijna-review-loop-invalid-cursor-completion -->\n" +
                  "Cursor completion marker does not match the current PR head. " +
                  "No Codex review was requested. Post `EDUVIJNA_CURSOR_COMPLETE <40-char-head-sha>` after the exact candidate is pushed."
              });
              return;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number, per_page: 100 }
            );
            const requestMarker = `<!-- eduvijna-codex-request head=${head} -->`;
            if (comments.some(c => (c.body || "").includes(requestMarker))) {
              return;
            }

            if (pr.data.draft) {
              await github.graphql(
                `mutation($id: ID!) {
                  markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                    pullRequest { id isDraft }
                  }
                }`,
                { id: pr.data.node_id }
              );
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body:
                requestMarker +
                "\n@codex review\n\n" +
                `Review exact SHA \`${head}\`. Report all correctness, governance, provenance, and acceptance findings. ` +
                "Do not merge."
            });

  codex-complete-to-cursor:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'codex-pull-request-review-summary') &&
      contains(github.event.comment.body, 'Completed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const summaryId = context.payload.comment.id;
            const handledMarker = `<!-- eduvijna-codex-summary-handled id=${summaryId} -->`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number, per_page: 100 }
            );
            if (comments.some(c => (c.body || "").includes(handledMarker))) {
              return;
            }

            // The Codex summary comment is created before inline review comments may settle.
            // Give GitHub a short window, then query the authoritative review-thread state.
            await new Promise(resolve => setTimeout(resolve, 15000));

            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const head = pr.data.head.sha;

            const data = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                        comments(first: 50) {
                          nodes {
                            body
                            url
                            author { login }
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              { owner, repo, number: pull_number }
            );

            const threads =
              data.repository.pullRequest.reviewThreads.nodes || [];
            const findings = [];
            for (const thread of threads) {
              if (thread.isResolved) continue;
              const codexComments = (thread.comments.nodes || []).filter(c =>
                c.author &&
                c.author.login &&
                c.author.login.startsWith("chatgpt-codex-connector")
              );
              if (codexComments.length) {
                const c = codexComments[codexComments.length - 1];
                findings.push({ body: c.body || "", url: c.url || "" });
              }
            }

            let iteration = 1;
            let maxIterations = 3;
            let task = `pr-${pull_number}`;
            const markerRe =
              /<!-- eduvijna-review-loop task=([^\s]+) iteration=(\d+) max=(\d+) -->/;
            for (const c of comments) {
              const m = (c.body || "").match(markerRe);
              if (m) {
                task = m[1];
                iteration = Number(m[2]);
                maxIterations = Number(m[3]);
              }
            }

            if (findings.length === 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body:
                  handledMarker +
                  `\n<!-- eduvijna-review-loop-complete task=${task} head=${head} -->\n` +
                  "✅ Codex review completed with no unresolved findings. " +
                  "Automated implementation/review loop is complete. Ready for Chief Architect/Founder gate; do not merge automatically."
              });
              return;
            }

            if (iteration >= maxIterations) {
              const details = findings
                .map((f, i) => `${i + 1}. ${f.body}\n   ${f.url}`)
                .join("\n\n");
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body:
                  handledMarker +
                  `\n<!-- eduvijna-review-loop-stop task=${task} iteration=${iteration} max=${maxIterations} -->\n` +
                  "🛑 **STOP_AND_ESCALATE** — the same task has reached the maximum of " +
                  `${maxIterations} implementation/review cycles and Codex still reports unresolved findings. ` +
                  "Do not assign another Cursor repair automatically.\n\n" +
                  details
              });
              return;
            }

            const nextIteration = iteration + 1;
            const details = findings
              .map((f, i) => `${i + 1}. ${f.body}\n   ${f.url}`)
              .join("\n\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body:
                handledMarker +
                `\n<!-- eduvijna-review-loop task=${task} iteration=${nextIteration} max=${maxIterations} -->\n` +
                `@cursor\n\n## Automated Codex repair assignment — iteration ${nextIteration}/${maxIterations}\n\n` +
                `Resolve every unresolved Codex finding below on the current task and PR. Keep scope narrow. ` +
                "Run only impacted tests unless shared infrastructure/migrations changed. " +
                "After pushing the exact corrected SHA, post a final PR comment containing " +
                "`EDUVIJNA_CURSOR_COMPLETE <40-char-head-sha>` and targeted test evidence. " +
                "Do not merge and do not start the next development day.\n\n" +
                details
            });
