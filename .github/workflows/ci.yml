name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest
      - name: Verify canonical domain sample
        run: python -m app.domain_verify
      - name: Migration round-trip
        run: |
          mkdir -p data
          DATABASE_URL=sqlite:///./data/migration-ci.db alembic upgrade head
          DATABASE_URL=sqlite:///./data/migration-ci.db alembic current --verbose
          DATABASE_URL=sqlite:///./data/migration-ci.db python - <<'PY'
          import sqlite3
          connection = sqlite3.connect("./data/migration-ci.db")
          try:
              print("alembic_version rows:", connection.execute("SELECT version_num FROM alembic_version").fetchall())
          finally:
              connection.close()
          PY
          DATABASE_URL=sqlite:///./data/migration-ci.db alembic downgrade 20261001_0001
          DATABASE_URL=sqlite:///./data/migration-ci.db alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Start local stack
        run: docker compose up --build -d
      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend
          exit 1
      - name: Verify documented developer commands
        run: |
          make lint
          make test
      - name: Verify API and frontend
        run: |
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/api/v1/system/info
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
      - name: Seed SQLite persistence record
        run: |
          docker compose exec -T backend python - <<'PY'
          from app.db.session import session_factory
          from app.models import SystemSetting

          session = session_factory()()
          try:
              current = session.query(SystemSetting).filter_by(key="ci.persistence").one_or_none()
              if current is None:
                  session.add(SystemSetting(key="ci.persistence", value="survives-restart"))
              else:
                  current.value = "survives-restart"
              session.commit()
          finally:
              session.close()
          PY
      - name: Restart persistence smoke
        run: |
          docker compose down
          docker compose up -d
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/ready >/dev/null
          docker compose exec -T backend python - <<'PY'
          from app.db.session import session_factory
          from app.models import SystemSetting

          session = session_factory()()
          try:
              row = session.query(SystemSetting).filter_by(key="ci.persistence").one()
              assert row.value == "survives-restart"
          finally:
              session.close()
          PY
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Cleanup
        if: always()
        run: docker compose down
