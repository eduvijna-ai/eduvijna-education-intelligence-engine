release: v1.0
kickoff_date: 2026-10-01
budget:
  monthly_tooling_ceiling_usd: 160
  chatgpt_pro_usd: 100
  cursor_pro_plus_usd: 60
  paid_overage_planned: false
builder:
  preferred_product: Cursor
  required_cursor_model: Composer 2.5
  required_cursor_model_excluded: Composer 2.5 Fast
  cursor_model_override:
    effective_from: 2026-10-05
    reconfirmed: 2026-10-06
    authority: explicit_founder_message
    instruction: Use standard Composer 2.5 only; not Composer 2.5 Fast
  cloud_agent_on_demand_billing: disabled
  zero_overage_fallback: ChatGPT-GitHub connected implementation
reviewer:
  product: Codex
source_of_truth: GitHub
ci_repair_policy:
  max_consecutive_failed_repair_iterations: 3
  scope: same_active_workstream
  on_limit: STOP_AND_ESCALATE
  infrastructure_retry_exempt: true
  deferred_external_evidence_gate_exempt: true
  required_handoff:
    - candidate_shas
    - ci_run_ids
    - failing_jobs
    - failure_classification
    - root_cause_hypothesis
    - proposed_next_action
  incremental_test_strategy:
    mode: impacted_tests_only
    full_regression_only_at_acceptance_checkpoint: true
    rerun_successful_unaffected_jobs_on_repair: false
    validator_change: relevant_validator_and_adversarial_tests
    docker_change: container_specific_smoke
    migration_or_shared_core_change: targeted_migration_and_shared_regression
    final_acceptance_checkpoint: one_full_regression
review_loop_policy:
  founder_approved: true
  approval_signal: "Approve the workflow and run pytest only for the implemented task, not all tasks every time."
  sequence:
    - chatgpt_handoff_to_cursor
    - cursor_implementation
    - cursor_targeted_pytest
    - codex_exact_sha_review
    - cursor_targeted_repair_if_findings
    - codex_rereview
  iteration_definition: one_cursor_candidate_plus_one_codex_review
  max_iterations_per_task: 3
  on_findings_after_iteration_3: STOP_AND_ESCALATE
  cursor_completion_marker: "EDUVIJNA_CURSOR_COMPLETE <40-char-head-sha>"
  exact_head_review_required: true
  pytest_policy:
    implementation_iteration: impacted_task_tests_only
    repair_iteration: impacted_finding_tests_only
    unaffected_historical_tests: do_not_rerun
    full_regression: final_acceptance_checkpoint_only
    early_full_regression_exception:
      - shared_core_change
      - schema_or_migration_change
      - test_infrastructure_change
  auto_merge: false
  auto_unlock_next_day: false
